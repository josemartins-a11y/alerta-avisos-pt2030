name: Verificar avisos Portugal 2030

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Executar verificação
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python check_avisos.py

      - name: Guardar novo estado no repositório
        run: |
          if [ -f avisos_state.json ]; then
            git config user.name "avisos-bot"
            git config user.email "avisos-bot@users.noreply.github.com"
            git add avisos_state.json
            git diff --staged --quiet || git commit -m "Atualizar estado dos avisos"
            git push
          else
            echo "Nada para guardar (execução fora da janela horária ou sem alterações)."
          fi
